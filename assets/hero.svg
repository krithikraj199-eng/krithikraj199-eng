<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KIRUTHICKRAJ T Matrix Space profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="45%" stop-color="#00150a"/>
      <stop offset="75%" stop-color="#160a2c"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <radialGradient id="nebula" cx="72%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity=".35"/>
      <stop offset="45%" stop-color="#31105f" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#39ff14" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .title { fill:#f5fff6; font-size:52px; font-weight:800; letter-spacing:6px; }
      .role { fill:#39ff14; font-size:21px; font-weight:700; letter-spacing:2.2px; }
      .small { fill:#9bdba5; font-size:14px; letter-spacing:1.2px; }
      .dim { fill:#8b949e; font-size:12px; }
      .cursor { animation: blink 1s steps(1) infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin:center; }
      .scan { animation: scan 6s linear infinite; }
      @keyframes blink { 50% { opacity:0; } }
      @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
      @keyframes scan { from { transform:translateY(-360px) } to { transform:translateY(360px) } }
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#nebula)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="88" cy="64" r="1.5"><animate attributeName="opacity" values=".15;1;.15" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="116" r="1"><animate attributeName="opacity" values="1;.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="48" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="975" cy="62" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1086" cy="134" r="1"><animate attributeName="opacity" values="1;.2;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="292" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="78" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="305" r="1.4"><animate attributeName="opacity" values="1;.25;1" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- matrix rain -->
  <g class="mono" fill="#39ff14" font-size="13" opacity=".28">
    <text x="42" y="20">0 1 1 0 1 0 0 1<animate attributeName="y" values="-30;390" dur="8s" repeatCount="indefinite"/></text>
    <text x="165" y="40">1 0 1 1 0 0 1 0<animate attributeName="y" values="-90;390" dur="10s" repeatCount="indefinite"/></text>
    <text x="1030" y="30">1 1 0 0 1 0 1 1<animate attributeName="y" values="-70;390" dur="9s" repeatCount="indefinite"/></text>
    <text x="1130" y="10">0 1 0 1 1 0 0 1<animate attributeName="y" values="-50;390" dur="7.5s" repeatCount="indefinite"/></text>
  </g>

  <!-- orbit / data planet -->
  <g transform="translate(938 183)">
    <circle r="92" fill="none" stroke="#7c3aed" stroke-opacity=".25"/>
    <ellipse rx="125" ry="35" fill="none" stroke="#39ff14" stroke-opacity=".45" transform="rotate(-12)">
      <animateTransform attributeName="transform" type="rotate" values="-12;348" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="58" fill="#09101a" stroke="#39ff14" stroke-opacity=".65" stroke-width="1.2"/>
    <path d="M-38 -8 C-15 -36, 20 -35, 41 -8 C20 11, -12 16, -38 -8Z" fill="#7c3aed" opacity=".22"/>
    <path d="M-42 14 C-18 -2, 18 1, 42 24 C16 43, -18 45, -42 14Z" fill="#39ff14" opacity=".13"/>
    <circle cx="84" cy="-24" r="5" fill="#39ff14" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- content -->
  <g class="mono">
    <text x="78" y="82" class="small">[ MATRIX // DEEP-SPACE // AI NODE ]</text>
    <text x="78" y="148" class="title" filter="url(#glow)">KIRUTHICKRAJ T</text>
    <text x="80" y="190" class="role">ASPIRING DATA SCIENTIST / DATA ANALYST</text>

    <rect x="78" y="222" width="570" height="78" rx="12" fill="#02070b" stroke="#39ff14" stroke-opacity=".32"/>
    <circle cx="103" cy="246" r="4" fill="#39ff14" class="pulse"/>
    <text x="120" y="251" class="small">&gt; MODE: LEARNING • BUILDING • SHIPPING</text>
    <text x="101" y="278" class="dim">&gt; DATA → MODELS → INTELLIGENCE → PRODUCTS</text>
    <text x="101" y="296" class="dim">&gt; STATUS: OPEN TO INTERNSHIPS <tspan class="cursor" fill="#39ff14">_</tspan></text>
  </g>

  <rect x="0" y="-4" width="1200" height="3" fill="#39ff14" opacity=".18" class="scan"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#39ff14" stroke-opacity=".18"/>
</svg>
