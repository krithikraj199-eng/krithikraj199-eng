name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman
          player_style: opportunistic
          hide_month_labels: "false"

      - name: Publish Pac-Man SVGs to output branch
        shell: bash
        run: |
          cp -R dist /tmp/pacman-dist

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan output-publish

          git rm -rf . || true

          cp /tmp/pacman-dist/*.svg .

          git add .

          git commit -m "chore: update Pac-Man contribution graph"

          git push --force origin HEAD:output