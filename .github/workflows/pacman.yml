name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate Pac-Man SVGs
        shell: bash
        run: |
          mkdir -p dist

          npx --yes pacman-contribution-graph@5.3.2 \
            --game pacman \
            --platform github \
            --username "${GITHUB_REPOSITORY_OWNER}" \
            --gameTheme github \
            --output dist/pacman-contribution-graph.svg

          npx --yes pacman-contribution-graph@5.3.2 \
            --game pacman \
            --platform github \
            --username "${GITHUB_REPOSITORY_OWNER}" \
            --gameTheme github-dark \
            --output dist/pacman-contribution-graph-dark.svg

      - name: Publish generated SVGs to output branch
        shell: bash
        run: |
          cp -R dist /tmp/pacman-dist

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan output-publish
          git rm -rf . || true
          cp /tmp/pacman-dist/*.svg .

          git add *.svg
          git commit -m "chore: update Pac-Man contribution graph"
          git push --force origin HEAD:output
